name: pretlab

services:
  api:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
        REVISION: ${APP_REVISION:-local}
    image: pretlab:${APP_VERSION:-dev}
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_HOST: db # nom du SERVICE sur le réseau Compose, pas localhost
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?copiez .env.example vers .env}
      POSTGRES_USER: ${POSTGRES_USER:?copiez .env.example vers .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copiez .env.example vers .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    # Aucun "ports:" ici : le port 5432 n'est PAS publié, seule l'api peut joindre la base.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copiez .env.example vers .env}
      POSTGRES_USER: ${POSTGRES_USER:?copiez .env.example vers .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copiez .env.example vers .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Bonus : interface d'administration, démarrée uniquement avec --profile debug
  adminer:
    image: adminer:4.8.1
    profiles: ["debug"]
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
